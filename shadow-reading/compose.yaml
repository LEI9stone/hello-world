services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-shadow_reading}
      MYSQL_USER: ${MYSQL_USER:-shadow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-shadow_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-shadow_root_dev}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: "8080"
      MYSQL_DSN: "${MYSQL_USER:-shadow}:${MYSQL_PASSWORD:-shadow_dev}@tcp(mysql:3306)/${MYSQL_DATABASE:-shadow_reading}?charset=utf8mb4&parseTime=true"
    ports:
      - "127.0.0.1:${PORT:-8081}:8080"
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  mysql_data:
