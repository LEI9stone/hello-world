<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WordFlow · 英文精读翻译</title>
    <style>
      :root {
        --ink: #17211b;
        --muted: #69736d;
        --line: #dfe4e1;
        --soft-line: #ecefed;
        --paper: #ffffff;
        --canvas: #f5f7f5;
        --green: #176b48;
        --green-dark: #0f5036;
        --green-soft: #e8f3ed;
        --amber: #d59625;
        --amber-soft: #fff4dc;
        --shadow: 0 14px 36px rgba(31, 50, 39, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 100vh;
        color: var(--ink);
        background: var(--canvas);
        font-family:
          Inter,
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          'PingFang SC',
          'Hiragino Sans GB',
          'Microsoft YaHei',
          sans-serif;
        letter-spacing: 0;
      }

      button,
      select {
        font: inherit;
      }

      button {
        color: inherit;
      }

      main {
        width: min(1440px, 100%);
        margin: 0 auto;
        padding: 28px;
      }

      .panel {
        min-width: 0;
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .tool-button,
      .segment-button {
        border: 0;
        cursor: pointer;
      }

      .result-panel {
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr) auto;
        min-height: calc(100vh - 120px);
      }

      .reading-toolbar {
        min-height: 54px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 9px 18px;
        background: #fafbfa;
        border-bottom: 1px solid var(--soft-line);
      }

      .playback-actions,
      .audio-controls,
      .speed-control {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .voice-select {
        width: 148px;
        height: 34px;
        padding: 0 28px 0 9px;
        color: #314139;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 6px;
        outline: none;
        font-size: 11px;
        font-weight: 650;
      }

      .voice-select:focus {
        border-color: var(--green);
        box-shadow: 0 0 0 3px rgba(23, 107, 72, 0.1);
      }

      .tool-button {
        height: 34px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        padding: 0 11px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 6px;
        color: #314139;
        font-size: 12px;
        font-weight: 650;
      }

      .tool-button:hover {
        color: var(--green);
        border-color: #a8c5b5;
      }

      .voice-select:disabled {
        cursor: wait;
        opacity: 0.52;
      }

      .tool-button svg {
        width: 15px;
        height: 15px;
        fill: currentColor;
      }

      .speed-label {
        margin-right: 2px;
        color: var(--muted);
        font-size: 11px;
      }

      .segmented {
        display: flex;
        padding: 3px;
        background: #edf0ee;
        border-radius: 6px;
      }

      .segment-button {
        width: 42px;
        height: 27px;
        padding: 0;
        color: var(--muted);
        background: transparent;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 700;
      }

      .segment-button.active {
        color: var(--green-dark);
        background: #fff;
        box-shadow: 0 1px 4px rgba(24, 42, 32, 0.12);
      }

      .reading-area {
        min-height: 0;
        overflow-y: auto;
        padding: 38px clamp(24px, 5vw, 64px) 42px;
      }

      .sentence-number {
        width: 24px;
        height: 24px;
        display: inline-grid;
        place-items: center;
        margin-bottom: 22px;
        color: var(--green-dark);
        background: var(--green-soft);
        border-radius: 50%;
        font-size: 11px;
        font-weight: 800;
      }

      .word-stream {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        column-gap: 5px;
        row-gap: 20px;
      }

      .word-token {
        min-width: 22px;
        display: inline-grid;
        grid-template-rows: 23px 31px;
        place-items: center;
        padding: 2px 5px;
        border: 0;
        border-radius: 5px;
        background: transparent;
        cursor: pointer;
        transition:
          background 150ms ease,
          color 150ms ease,
          transform 150ms ease;
      }

      .word-token:hover {
        color: var(--green-dark);
        background: var(--green-soft);
        transform: translateY(-1px);
      }

      .word-token.active {
        color: #79520c;
        background: var(--amber-soft);
        box-shadow: inset 0 -2px 0 var(--amber);
      }

      .phonetic {
        color: #7b8580;
        font-family: 'Arial Unicode MS', Arial, sans-serif;
        font-size: 11px;
        line-height: 1;
        white-space: nowrap;
      }

      .word {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 21px;
        line-height: 1;
        white-space: nowrap;
      }

      .translation-block {
        margin-top: 34px;
        padding-top: 26px;
        border-top: 1px solid var(--line);
      }

      .translation-label {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 750;
      }

      .translation-label::before {
        content: '';
        width: 18px;
        height: 2px;
        background: var(--amber);
      }

      .translation {
        margin: 0;
        color: #26342d;
        font-size: 18px;
        line-height: 1.9;
      }

      .word-detail {
        min-height: 78px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 18px;
        padding: 14px 20px;
        background: #f7faf8;
        border-top: 1px solid var(--line);
      }

      .detail-main {
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .detail-speaker {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        color: var(--green-dark);
        background: var(--green-soft);
        border: 0;
        border-radius: 50%;
        cursor: pointer;
      }

      .detail-speaker svg {
        width: 17px;
        height: 17px;
        fill: currentColor;
      }

      .detail-word {
        margin-right: 8px;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 18px;
        font-weight: 700;
      }

      .detail-phonetic {
        color: var(--green);
        font-size: 12px;
      }

      .detail-meaning {
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .play-state {
        min-width: 76px;
        color: var(--muted);
        font-size: 11px;
        text-align: right;
      }

      .play-state.speaking {
        color: var(--green);
        font-weight: 700;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 24px;
        z-index: 10;
        max-width: calc(100vw - 32px);
        padding: 10px 14px;
        color: #fff;
        background: rgba(26, 37, 31, 0.94);
        border-radius: 6px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
        font-size: 12px;
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, 8px);
        transition: 160ms ease;
      }

      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      @media (max-width: 900px) {
        main {
          padding: 16px;
        }

        .result-panel {
          min-height: 620px;
        }
      }

      @media (max-width: 560px) {
        .speed-label {
          display: none;
        }

        main {
          padding: 10px;
        }

        .reading-toolbar {
          padding-left: 14px;
          padding-right: 14px;
        }

        .reading-toolbar {
          flex-wrap: wrap;
        }

        .audio-controls {
          width: 100%;
          justify-content: space-between;
        }

        .voice-select {
          width: min(150px, 46vw);
        }

        .tool-button span {
          display: none;
        }

        .tool-button {
          width: 34px;
          padding: 0;
        }

        .segment-button {
          width: 36px;
        }

        .reading-area {
          padding: 28px 18px 34px;
        }

        .word-stream {
          column-gap: 3px;
          row-gap: 17px;
        }

        .word-token {
          padding-left: 4px;
          padding-right: 4px;
        }

        .word {
          font-size: 19px;
        }

        .phonetic {
          font-size: 10px;
        }

        .translation {
          font-size: 16px;
        }

        .word-detail {
          grid-template-columns: minmax(0, 1fr);
        }

        .play-state {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel result-panel" aria-label="逐词精读">
          <div class="reading-toolbar">
            <div class="playback-actions">
              <button
                class="tool-button"
                id="play-all"
                type="button"
                title="朗读整段"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M8 5.6v12.8c0 .8.9 1.3 1.6.8l9.2-6.4a1 1 0 0 0 0-1.6L9.6 4.8A1 1 0 0 0 8 5.6Z"
                  />
                </svg>
                <span>朗读整段</span>
              </button>
              <button
                class="tool-button"
                id="stop-all"
                type="button"
                title="停止朗读"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M6.5 6.5h11v11h-11z" />
                </svg>
                <span>停止</span>
              </button>
            </div>
            <div class="audio-controls">
              <select
                class="voice-select"
                id="voice-select"
                aria-label="浏览器系统英文音色"
              >
                <option value="">系统默认英文</option>
              </select>
              <div class="speed-control" aria-label="朗读速度">
                <span class="speed-label">语速</span>
                <div class="segmented">
                  <button class="segment-button" type="button" data-rate="0.8">
                    0.8x
                  </button>
                  <button
                    class="segment-button active"
                    type="button"
                    data-rate="1"
                  >
                    1x
                  </button>
                  <button class="segment-button" type="button" data-rate="1.2">
                    1.2x
                  </button>
                </div>
              </div>
            </div>
          </div>

          <div class="reading-area">
            <span class="sentence-number" aria-label="第 1 段">1</span>
            <div class="word-stream" id="word-stream"></div>

            <div class="translation-block">
              <div class="translation-label">中文翻译</div>
              <p class="translation" id="translation"></p>
            </div>
          </div>

          <div class="word-detail" aria-live="polite">
            <div class="detail-main">
              <button
                class="detail-speaker"
                id="detail-speaker"
                type="button"
                title="播放当前单词"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M4 9v6h4l5 4V5L8 9H4Zm12.4-.9a1 1 0 0 0-1.4 1.4 3.5 3.5 0 0 1 0 5 1 1 0 0 0 1.4 1.4 5.5 5.5 0 0 0 0-7.8Zm2.8-2.8a1 1 0 1 0-1.4 1.4 7.5 7.5 0 0 1 0 10.6 1 1 0 1 0 1.4 1.4 9.5 9.5 0 0 0 0-13.4Z"
                  />
                </svg>
              </button>
              <div>
                <div>
                  <span class="detail-word" id="detail-word">curiosity</span>
                  <span class="detail-phonetic" id="detail-phonetic"
                    >/ˌkjʊriˈɒsəti/</span
                  >
                </div>
                <div class="detail-meaning" id="detail-meaning">
                  n. 好奇心；求知欲
                </div>
              </div>
            </div>
            <div class="play-state" id="play-state">点击单词发音</div>
          </div>
      </section>
    </main>

    <div class="toast" id="toast" role="status"></div>

    <script>
      const sample = {
        text: 'Curiosity turns ordinary moments into opportunities for discovery. When we ask thoughtful questions, even familiar ideas can reveal something new.',
        translation:
          '好奇心能把平凡的时刻变成探索的机会。当我们提出有思考的问题时，即使是熟悉的想法也能展现出新的一面。',
        words: [
          ['Curiosity', '/ˌkjʊriˈɒsəti/', 'n. 好奇心；求知欲'],
          ['turns', '/tɜːnz/', 'v. 使变成；转变'],
          ['ordinary', '/ˈɔːdənri/', 'adj. 普通的；平常的'],
          ['moments', '/ˈməʊmənts/', 'n. 时刻；片刻'],
          ['into', '/ˈɪntuː/', 'prep. 到……里面；成为'],
          ['opportunities', '/ˌɒpəˈtjuːnətiz/', 'n. 机会；时机'],
          ['for', '/fɔːr/', 'prep. 为了；对于'],
          ['discovery.', '/dɪˈskʌvəri/', 'n. 发现；探索成果'],
          ['When', '/wen/', 'conj. 当……时'],
          ['we', '/wiː/', 'pron. 我们'],
          ['ask', '/ɑːsk/', 'v. 询问；提出'],
          ['thoughtful', '/ˈθɔːtfl/', 'adj. 深思熟虑的'],
          ['questions,', '/ˈkwestʃənz/', 'n. 问题'],
          ['even', '/ˈiːvən/', 'adv. 甚至；即使'],
          ['familiar', '/fəˈmɪliə/', 'adj. 熟悉的'],
          ['ideas', '/aɪˈdɪəz/', 'n. 想法；观念'],
          ['can', '/kæn/', 'modal v. 能够'],
          ['reveal', '/rɪˈviːl/', 'v. 揭示；展现'],
          ['something', '/ˈsʌmθɪŋ/', 'pron. 某事；某物'],
          ['new.', '/njuː/', 'adj. 新的'],
        ],
      };
      const wordStream = document.querySelector('#word-stream');
      const translation = document.querySelector('#translation');
      const detailWord = document.querySelector('#detail-word');
      const detailPhonetic = document.querySelector('#detail-phonetic');
      const detailMeaning = document.querySelector('#detail-meaning');
      const playState = document.querySelector('#play-state');
      const toast = document.querySelector('#toast');
      const voiceSelect = document.querySelector('#voice-select');
      let activeWordIndex = 0;
      let activeVoice = null;
      let rate = 1;
      let toastTimer;
      let englishVoices = [];

      const preferredVoicePatterns = [
        /Microsoft.*(Ava|Jenny|Aria).*Natural/i,
        /^Samantha$/i,
        /^Google US English$/i,
        /Microsoft.*(Natural|Online)/i,
        /^Alex$/i,
        /^Daniel$/i,
      ];

      const cleanWord = (word) => word.replace(/[^a-zA-Z'-]/g, '');

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
      }

      function voiceKey(voice) {
        return voice.voiceURI || `${voice.name}|${voice.lang}`;
      }

      function choosePreferredVoice(voices) {
        for (const pattern of preferredVoicePatterns) {
          const match = voices.find((voice) => pattern.test(voice.name));
          if (match) return match;
        }
        return (
          voices.find((voice) => voice.default && voice.lang === 'en-US') ||
          voices.find((voice) => voice.lang === 'en-US') ||
          voices.find((voice) => voice.default) ||
          voices[0] ||
          null
        );
      }

      function loadSystemVoices() {
        if (!('speechSynthesis' in window)) {
          voiceSelect.disabled = true;
          return;
        }

        const voices = window.speechSynthesis.getVoices();
        englishVoices = voices.filter((voice) =>
          voice.lang.toLowerCase().startsWith('en'),
        );
        if (!englishVoices.length) return;

        const previousKey = activeVoice ? voiceKey(activeVoice) : '';
        activeVoice =
          englishVoices.find((voice) => voiceKey(voice) === previousKey) ||
          choosePreferredVoice(englishVoices);

        voiceSelect.replaceChildren();
        englishVoices.forEach((voice) => {
          const option = document.createElement('option');
          option.value = voiceKey(voice);
          option.textContent = `${voice.name} · ${voice.lang}`;
          voiceSelect.appendChild(option);
        });
        voiceSelect.value = voiceKey(activeVoice);
      }

      function clearSpeakingState() {
        document
          .querySelectorAll('.word-token.active')
          .forEach((item) => item.classList.remove('active'));
        playState.textContent = '点击单词发音';
        playState.classList.remove('speaking');
      }

      function stopSpeech() {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        clearSpeakingState();
      }

      function speak(text, index = null) {
        if (!('speechSynthesis' in window)) {
          showToast('当前浏览器不支持系统语音');
          return;
        }

        stopSpeech();
        if (index !== null) {
          const token = wordStream.children[index];
          token?.classList.add('active');
        }

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = activeVoice?.lang || 'en-US';
        utterance.rate = rate;
        if (activeVoice) utterance.voice = activeVoice;
        utterance.onstart = () => {
          playState.textContent = index === null ? '正在朗读整段' : '正在播放';
          playState.classList.add('speaking');
        };
        utterance.onend = clearSpeakingState;
        utterance.onerror = (event) => {
          clearSpeakingState();
          if (event.error !== 'canceled' && event.error !== 'interrupted') {
            showToast('系统语音播放失败，请切换音色后重试');
          }
        };
        window.speechSynthesis.speak(utterance);
      }

      function selectWord(index, shouldSpeak = true) {
        const item = sample.words[index];
        if (!item) return;
        activeWordIndex = index;
        detailWord.textContent = cleanWord(item[0]);
        detailPhonetic.textContent = item[1];
        detailMeaning.textContent = item[2];
        if (shouldSpeak) speak(cleanWord(item[0]), index);
      }

      function renderResult() {
        wordStream.replaceChildren();

        sample.words.forEach((item, index) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'word-token';
          button.title = `播放 ${cleanWord(item[0])}`;
          button.setAttribute(
            'aria-label',
            `${item[0]}，音标 ${item[1]}，点击发音`,
          );
          button.innerHTML = `<span class="phonetic">${item[1]}</span><span class="word">${item[0]}</span>`;
          button.addEventListener('click', () => selectWord(index));
          wordStream.appendChild(button);
        });

        translation.textContent = sample.translation;
        selectWord(0, false);
      }

      document
        .querySelector('#play-all')
        .addEventListener('click', () => speak(sample.text));
      document.querySelector('#stop-all').addEventListener('click', stopSpeech);
      document
        .querySelector('#detail-speaker')
        .addEventListener('click', () => selectWord(activeWordIndex));
      voiceSelect.addEventListener('change', (event) => {
        activeVoice =
          englishVoices.find(
            (voice) => voiceKey(voice) === event.target.value,
          ) || null;
        stopSpeech();
      });

      document.querySelectorAll('.segment-button').forEach((button) => {
        button.addEventListener('click', () => {
          document
            .querySelectorAll('.segment-button')
            .forEach((item) => item.classList.remove('active'));
          button.classList.add('active');
          rate = Number(button.dataset.rate);
          stopSpeech();
        });
      });

      if ('speechSynthesis' in window) {
        window.speechSynthesis.addEventListener(
          'voiceschanged',
          loadSystemVoices,
        );
      }
      window.addEventListener('beforeunload', stopSpeech);
      renderResult();
      loadSystemVoices();
    </script>
  </body>
</html>
